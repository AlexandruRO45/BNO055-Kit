[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bno055-kit"
version = "0.1.0"
description = "BNO055 I2C IMU boot-time recorder and candump time-sync companion"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "adafruit-circuitpython-bno055",
    "adafruit-blinka",
    # blinka's Jetson platform backend: without it, `import board` on the
    # Orin dies with "The platform library 'Jetson' was not found".
    "Jetson.GPIO; platform_machine == 'aarch64'",
    "smbus2",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "cantools",
]

[project.scripts]
bno055-kit = "bno055_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bno055_kit = ["analysis/dbc/*.dbc"]

[tool.ruff]
target-version = "py310"
line-length = 99
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
